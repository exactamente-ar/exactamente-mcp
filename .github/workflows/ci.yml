name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los tipos de la API se generan del OpenAPI del backend. Si el contrato
      # cambió y acá no se regeneró, este repo estaría compilando contra una
      # API que ya no existe.
      - run: pnpm check:api

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      # Se buildea el target de Cloudflare, que es el que va a producción.
      - run: pnpm build:cf
